name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      SUPERMEMORY_HOME: ${{ github.workspace }}/.tmp-smoke
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Environment check
        run: python -m supermemory doctor
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Retrieval benchmark
        run: >-
          python -m supermemory bench bench/cases.jsonl
          --fail-under-recall 0.85
          --fail-under-mrr 0.75

  windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SUPERMEMORY_HOME: ${{ github.workspace }}/.tmp-smoke
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Environment check
        run: python -m supermemory doctor
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Retrieval benchmark
        run: >-
          python -m supermemory bench bench/cases.jsonl
          --fail-under-recall 0.85
          --fail-under-mrr 0.75
